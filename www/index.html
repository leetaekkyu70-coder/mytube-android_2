<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MyTube 모바일</title>
  <style>
    :root,
    :root[data-theme="light"] {
      --bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.96);
      --surface: #f2f2f2;
      --surface-hover: #e5e5e5;
      --border: #e5e5e5;
      --input-border: #cccccc;
      --input-bg: #ffffff;
      --player-bg: #f8f8f8;
      --chip-active-bg: #0f0f0f;
      --chip-active-text: #ffffff;
      --text: #0f0f0f;
      --muted: #606060;
      --primary-bg: #0f0f0f;
      --primary-text: #ffffff;
      --red: #ff0000;
      --green: #0d7a48;
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --header-bg: rgba(15, 15, 15, 0.96);
      --surface: #272727;
      --surface-hover: #3f3f3f;
      --border: #2c2c2c;
      --input-border: #3a3a3a;
      --input-bg: #141414;
      --player-bg: #181818;
      --chip-active-bg: #f1f1f1;
      --chip-active-text: #0f0f0f;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --primary-bg: #f1f1f1;
      --primary-text: #0f0f0f;
      --red: #ff0000;
      --green: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Roboto', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      padding: 68px 14px calc(28px + env(safe-area-inset-bottom));
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: var(--header-bg); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; cursor: pointer; }
    .yt-badge {
      background: var(--red); color: #fff; width: 28px; height: 20px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .btn {
      min-height: 36px; padding: 0 12px; border-radius: 18px; border: none;
      background: var(--surface); color: var(--text);
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:hover:not(:disabled) { background: var(--surface-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--primary-bg); color: var(--primary-text); }
    .container { max-width: 1120px; margin: 0 auto; }
    .url-card, #player-box {
      background: var(--player-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-bottom: 12px;
    }
    .url-row { display: flex; gap: 8px; }
    .url-input {
      flex: 1; height: 42px; padding: 0 14px; border-radius: 21px;
      border: 1px solid var(--input-border); background: var(--input-bg);
      color: var(--text); font-size: 14px; outline: none;
    }
    .quick-dl-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .dl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    @media (max-width: 520px) { .quick-dl-row { grid-template-columns: repeat(2, 1fr); } }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .chip-row::-webkit-scrollbar { height: 0; }
    .chip {
      height: 34px; padding: 0 14px; border-radius: 17px; border: none;
      background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); }
    #player-box { display: none; margin-bottom: 16px; }
    .video-frame-wrap { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 10px; overflow: hidden; }
    .video-frame-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .now-title { font-size: 16px; font-weight: 700; margin-top: 10px; }
    .now-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .progress-panel {
      display: none; margin-top: 10px; padding: 10px 12px;
      border-radius: 10px; background: var(--input-bg); border: 1px solid var(--border); font-size: 12px;
    }
    .progress-track { width: 100%; height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; margin-top: 6px; }
    .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s ease; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--player-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
    .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dur {
      position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,0.82);
      color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600;
    }
    .card-body { padding: 10px 12px; }
    .card-title { font-size: 14px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="brand" onclick="renderFeed('all')">
      <span class="yt-badge">▶</span>
      <span>MyTube</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn" id="theme-btn" onclick="toggleTheme()">🌙 다크</button>
      <button class="btn" id="bm-filter-btn" onclick="renderFeed('bookmarks')">⭐ 저장함 (0)</button>
    </div>
  </header>

  <div class="container">
    <div class="url-card">
      <div class="url-row">
        <input type="url" id="url-input" class="url-input" placeholder="유튜브 영상 URL 붙여넣기 (예: https://youtu.be/...)" />
        <button class="btn primary" onclick="openFromUrl('play')">재생</button>
      </div>
      <div class="quick-dl-row">
        <button class="btn" onclick="openFromUrl('play')">▶ 바로 재생</button>
        <button class="btn" onclick="openFromUrl('mp3')">🎵 MP3 저장</button>
        <button class="btn" onclick="openFromUrl('wav')">🎼 WAV 저장</button>
        <button class="btn" onclick="openFromUrl('mp4')">🎬 MP4 저장</button>
      </div>
    </div>

    <div class="chip-row" id="category-chips"></div>

    <section id="player-box">
      <div class="video-frame-wrap">
        <iframe id="yt-iframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="now-title" id="now-title"></div>
      <div class="now-sub" id="now-sub"></div>
      <div class="dl-grid">
        <button class="btn dl-btn" onclick="startDownload('mp3')">🎵 MP3 저장</button>
        <button class="btn dl-btn" onclick="startDownload('wav')">🎼 WAV 저장</button>
        <button class="btn dl-btn" onclick="startDownload('mp4')">🎬 MP4 저장</button>
      </div>
      <div class="progress-panel" id="progress-panel">
        <div id="progress-text">다운로드 준비 중...</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </section>

    <div class="grid" id="video-grid"></div>
  </div>

  <script>
    const CATEGORIES = {
      "음악": [
        { id: "jfKfPfyJRdk", title: "lofi hip hop radio - beats to relax/study to", channel: "Lofi Girl", dur: "LIVE" },
        { id: "5qap5aO4i9A", title: "Acoustic Guitar & Piano Chill Session", channel: "Aul_70 Studio", dur: "18:24" }
      ],
      "음식 만들기": [
        { id: "dQw4w9WgXcQ", title: "10분 초간단 자취 요리 레시피 모음", channel: "1분요리 뚝딱이형", dur: "11:05" }
      ],
      "뉴스": [
        { id: "M7lc1UVf-VE", title: "오늘의 주요 경제·산업 브리핑", channel: "MBCNEWS", dur: "06:40" }
      ]
    };

    let currentTab = "all";
    let activeVideo = null;
    const bookmarks = JSON.parse(localStorage.getItem("mytube_mob_bm") || "[]");
    let theme = localStorage.getItem("mytube_mob_theme") || "light";

    function applyTheme(next) {
      theme = next;
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("mytube_mob_theme", theme);
      document.getElementById("theme-btn").textContent = theme === "dark" ? "☀️ 라이트" : "🌙 다크";
    }
    function toggleTheme() { applyTheme(theme === "dark" ? "light" : "dark"); }
    applyTheme(theme);

    function extractVideoId(input) {
      const s = (input || "").trim();
      if (/^[\w-]{11}$/.test(s)) return s;
      const m = s.match(/(?:v=|\/v\/|\/embed\/|\/shorts\/|\/live\/|youtu\.be\/)([\w-]{11})/);
      return m ? m[1] : "";
    }

    function updateBookmarkLabel() {
      document.getElementById("bm-filter-btn").textContent = `⭐ 저장함 (${bookmarks.length})`;
    }

    function renderChips() {
      const tabs = ["all", ...Object.keys(CATEGORIES)];
      document.getElementById("category-chips").innerHTML = tabs.map(t => `
        <button class="chip ${currentTab === t ? "active" : ""}" onclick="renderFeed('${t}')">
          ${t === "all" ? "전체" : t}
        </button>
      `).join("");
    }

    function renderFeed(tab) {
      currentTab = tab;
      renderChips();
      updateBookmarkLabel();

      const list = tab === "bookmarks" ? bookmarks : (tab === "all" ? Object.values(CATEGORIES).flat() : (CATEGORIES[tab] || []));
      const grid = document.getElementById("video-grid");
      if (!list.length) {
        grid.innerHTML = `<div style="color:var(--muted);padding:28px 0;">표시할 항목이 없습니다. 상단에 URL을 붙여넣어 보세요.</div>`;
        return;
      }
      grid.innerHTML = list.map(v => `
        <div class="card" onclick='selectVideo(${JSON.stringify(v)})'>
          <div class="thumb">
            <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" />
            ${v.dur ? `<span class="dur">${v.dur}</span>` : ""}
          </div>
          <div class="card-body">
            <div class="card-title">${v.title}</div>
            <div class="card-meta">${v.channel}</div>
          </div>
        </div>
      `).join("");
    }

    function selectVideo(video) {
      activeVideo = video;
      document.getElementById("player-box").style.display = "block";
      document.getElementById("yt-iframe").src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0`;
      document.getElementById("now-title").textContent = video.title;
      document.getElementById("now-sub").textContent = `${video.channel} · ${video.id}`;
      document.getElementById("progress-panel").style.display = "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function openFromUrl(action) {
      const vid = extractVideoId(document.getElementById("url-input").value);
      if (!vid) {
        alert("유효한 유튜브 영상 URL을 입력해 주세요.");
        return;
      }
      selectVideo({ id: vid, title: `YouTube 영상 (${vid})`, channel: "URL 직접 열기", dur: "" });
      if (action !== "play") await startDownload(action);
    }

    function updateProgressUI(percent, message, isError = false, isDone = false) {
      const panel = document.getElementById("progress-panel");
      const textEl = document.getElementById("progress-text");
      const fillEl = document.getElementById("progress-fill");
      panel.style.display = "block";
      const safePct = Math.max(0, Math.min(100, Number(percent) || 0));
      fillEl.style.width = `${safePct}%`;
      fillEl.style.background = isError ? "#ef4444" : (isDone ? "#0d7a48" : "#10b981");
      textEl.style.color = isError ? "#ef4444" : (isDone ? "var(--green)" : "var(--text)");
      textEl.textContent = message;
    }

    async function startDownload(format) {
      if (!activeVideo) return;
      const plugin = window.Capacitor?.Plugins?.MediaDownloader;
      const btns = document.querySelectorAll(".dl-btn");
      btns.forEach(b => (b.disabled = true));
      updateProgressUI(5, `[${format.toUpperCase()}] 다운로드 엔진 준비 중...`);

      if (!plugin) {
        updateProgressUI(0, "안드로이드 앱(Capacitor) 환경에서만 네이티브 저장이 실행됩니다.", true);
        btns.forEach(b => (b.disabled = false));
        return;
      }

      try {
        const res = await plugin.download({
          url: `https://www.youtube.com/watch?v=${activeVideo.id}`,
          format
        });
        updateProgressUI(100, `저장 완료: ${res.folder}`, false, true);
      } catch (err) {
        updateProgressUI(0, `저장 실패: ${err.message || err}`, true);
      } finally {
        btns.forEach(b => (b.disabled = false));
      }
    }

    if (window.Capacitor?.Plugins?.MediaDownloader) {
      window.Capacitor.Plugins.MediaDownloader.addListener("downloadProgress", event => {
        const pct = Number(event.progress) || 0;
        updateProgressUI(pct, `${event.stage || "처리 중..."} (${pct.toFixed(1)}%)`);
      });
    }

    updateBookmarkLabel();
    renderFeed("all");
  </script>
</body>
</html>
